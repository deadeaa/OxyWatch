name: oxywatch
description: Aplikasi monitoring kesehatan anak

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ==========================
  # Firebase
  # ==========================
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  http: ^1.2.2
  # UI & State Management
  provider: ^6.0.5
  google_fonts: ^6.2.1

  fl_chart: ^0.68.0

  # Maps (Gratis)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
